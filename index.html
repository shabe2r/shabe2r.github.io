<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shabe2r</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#050507;
    color:#ece7d9;
    font-family:"Arial Black", "Helvetica Neue", Arial, sans-serif;
    min-height:100vh;
  }
  .wrap { max-width:980px; margin:0 auto; padding:26px 26px 60px; }
  header {
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 0 30px;
  }
  .logo { font-size:26px; font-weight:900; letter-spacing:2px; color:#ece7d9; }
  .logo .dot { color:#c6f24e; }
  nav { display:flex; gap:26px; }
  nav a {
    color:#d8d8d8; text-decoration:none; font-family:Arial, sans-serif;
    font-size:13px; letter-spacing:3px;
  }
  .hero { padding-top:11vh; }
  .hello {
    font-family:"Courier New", monospace;
    color:#c6f24e; font-size:clamp(19px, 4vw, 26px);
    letter-spacing:6px; margin-bottom:22px;
  }
  h1 {
    font-size:clamp(54px, 14vw, 122px);
    line-height:.98; font-weight:900; letter-spacing:1px;
    text-transform:uppercase;
  }
  h1 .solid { color:#e6dfc8; display:block; }
  h1 .outline {
    display:block; color:transparent;
    -webkit-text-stroke:2px #e6dfc8;
  }
  h1 .dot { color:#c6f24e; -webkit-text-stroke:0; }
  .sub {
    margin-top:34px;
    font-family:Arial, sans-serif;
    color:#9a9aa5; font-size:clamp(18px, 4vw, 26px);
    line-height:1.5; font-weight:400; max-width:640px;
  }
  @media (max-width:560px) { nav { gap:15px; } nav a { font-size:11px; letter-spacing:2px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">SHABE2R<span class="dot">.</span></div>
    <nav><a href="#">HOME</a><a href="#">ABOUT</a><a href="#">CONTACT</a></nav>
  </header>

  <div class="hero">
    <div class="hello">Hi 👋</div>
    <h1>
      <span class="solid">Shabe2r</span>
      <span class="outline">here<span class="dot">.</span></span>
    </h1>
    <p class="sub">Just for testing. Nothing here at the time</p>
  </div>
</div>
</body>
</html>
