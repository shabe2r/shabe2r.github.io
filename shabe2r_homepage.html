<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08090d">
<title>Shabe2r — Home</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{--bg:#08090d;--text:#f5f5f7;--muted:#858792;--accent:#a5b4fc}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,sans-serif;overflow:hidden}
.background{position:fixed;inset:0;overflow:hidden;z-index:-1;background:radial-gradient(ellipse at 50% 45%,#15172b 0%,transparent 55%),#08090d}
.orb{position:absolute;width:350px;height:350px;border-radius:50%;filter:blur(100px);opacity:.17;animation:float 12s ease-in-out infinite alternate}
.orb-one{background:#6557ff;top:-150px;left:-100px}
.orb-two{background:#236dff;bottom:-180px;right:-80px;animation-delay:-5s}
@keyframes float{from{transform:translate(0,0) scale(1)}to{transform:translate(100px,80px) scale(1.25)}}
.grid{position:fixed;inset:0;z-index:-1;opacity:.12;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:65px 65px;mask-image:linear-gradient(to bottom,black,transparent 90%)}
.loader{position:fixed;inset:0;background:#08090d;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:22px;z-index:100;transition:opacity .8s ease,visibility .8s ease}
.loader.hide{opacity:0;visibility:hidden}
.loader-name{font-size:23px;font-weight:700;letter-spacing:4px;animation:pulse 1.4s ease-in-out infinite}
.loader-track{width:120px;height:2px;background:#242530;overflow:hidden}
.loader-bar{height:100%;background:var(--accent);animation:loading 1.5s ease-in-out forwards}
@keyframes loading{from{width:0}to{width:100%}}
@keyframes pulse{50%{opacity:.45}}
main{min-height:100vh;display:flex;flex-direction:column;padding:35px 7%}
nav{display:flex;justify-content:space-between;align-items:center;opacity:0;transform:translateY(-12px);animation:reveal 1s ease 1.8s forwards}
.logo{font-size:19px;font-weight:800;letter-spacing:-1px}
.logo span{color:var(--accent)}
.status{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:12px;letter-spacing:.5px}
.status-dot{width:7px;height:7px;background:#75e6a3;border-radius:50%;box-shadow:0 0 12px #75e6a377}
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;max-width:900px;margin:0 auto;width:100%}
.eyebrow{color:var(--accent);font-size:12px;letter-spacing:4px;text-transform:uppercase;margin-bottom:30px;opacity:0;animation:reveal .8s ease 2s forwards}
h1{font-size:clamp(52px,9vw,108px);line-height:1.12;letter-spacing:-6px;font-weight:700}
.line{display:block;overflow:hidden;padding-bottom:8px}
.line span{display:block;transform:translateY(110%);animation:slideUp 1s cubic-bezier(.16,1,.3,1) forwards}
.line:nth-child(2) span{animation-delay:.2s}
.gradient{background:linear-gradient(100deg,#f5f5f7 10%,#a5b4fc 55%,#8584ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.subtitle{margin-top:25px;font-size:clamp(16px,2vw,20px);color:#9294a1;font-weight:400;opacity:0;animation:reveal 1s ease 2.8s forwards}
.subtitle strong{color:#e6e7ef;font-weight:500}
.actions{margin-top:38px;opacity:0;animation:reveal 1s ease 3s forwards}
.button{display:inline-flex;align-items:center;gap:12px;padding:15px 22px;border-radius:50px;background:#f5f5f7;color:#08090d;text-decoration:none;font-size:14px;font-weight:600;transition:transform .3s,background .3s}
.button:hover{transform:translateY(-4px);background:#c9ccff}
.arrow{transition:transform .3s}
.button:hover .arrow{transform:translateX(5px)}
footer{display:flex;justify-content:space-between;align-items:center;gap:15px;color:#666875;font-size:11px;letter-spacing:1px;opacity:0;animation:reveal 1s ease 3.2s forwards}
.footer-right{display:flex;align-items:center;gap:7px}
@keyframes slideUp{to{transform:translateY(0)}}
@keyframes reveal{to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){main{padding:27px 7%}h1{font-size:clamp(46px,12vw,70px);letter-spacing:-3px}.eyebrow{font-size:10px;letter-spacing:3px;margin-bottom:25px}.subtitle{line-height:1.8;max-width:300px}footer{font-size:9px;letter-spacing:.5px}.orb{width:250px;height:250px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}.loader{display:none}.line span{transform:translateY(0)}nav,.eyebrow,.subtitle,.actions,footer{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="loader" id="loader">
  <div class="loader-name">SHABE2R<span class="gradient">.</span></div>
  <div class="loader-track"><div class="loader-bar"></div></div>
</div>
<div class="background"><div class="orb orb-one"></div><div class="orb orb-two"></div></div>
<div class="grid"></div>
<main>
  <nav>
    <div class="logo">shabe2r<span>.</span></div>
    <div class="status"><span class="status-dot"></span>JUST VIBING</div>
  </nav>
  <section class="hero">
    <div class="eyebrow">A LITTLE SPACE ON THE INTERNET</div>
    <h1>
      <span class="line"><span>Hi,</span></span>
      <span class="line"><span class="gradient">Shabe2r here.</span></span>
    </h1>
    <p class="subtitle">What's up? <strong>Welcome to my corner of the internet.</strong></p>
    <div class="actions"><a href="mailto:hello@example.com" class="button">Say hello <span class="arrow">↗</span></a></div>
  </section>
  <footer><span>© 2026 SHABE2R</span><span class="footer-right">MADE WITH <span class="gradient">♥</span></span></footer>
</main>
<script>
const loader=document.getElementById('loader');
window.addEventListener('load',()=>{setTimeout(()=>loader.classList.add('hide'),1600)});
</script>
</body>
</html>
